name: Contract tests

# Runs this repo's own changes (new contracts, recorder changes) against real
# Aquifer and Spillway containers. Each backend is checked out at the branch
# with the same name as this PR's branch when one exists, so a paired change
# across repos is tested together, and at main otherwise.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [aquifer, spillway]
    steps:
      - name: Checkout aqueduct-runner
        uses: actions/checkout@v4
        with:
          path: aqueduct-runner

      - name: Pick the ${{ matrix.backend }} branch
        id: backend
        env:
          BRANCH: ${{ github.head_ref }}
          REPO: https://github.com/rjpruitt16/${{ matrix.backend }}
        run: |
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$REPO" "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing ${{ matrix.backend }}@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ matrix.backend }}
        uses: actions/checkout@v4
        with:
          repository: rjpruitt16/${{ matrix.backend }}
          ref: ${{ steps.backend.outputs.ref }}
          path: backend

      # Dagger occasionally fails to load this module's Python SDK on a cold
      # engine ("failed to load sdk for local module source"), before any
      # test runs. Load it here, with retries, so a setup hiccup doesn't fail
      # the run. The test steps below then reuse the warm engine and run once.
      - name: Load the aqueduct-runner module (retries Dagger setup failures)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" DAGGER_VERSION=0.21.8 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3; do
            if "$HOME/.local/bin/dagger" -m ./aqueduct-runner functions > /dev/null; then
              exit 0
            fi
            echo "::warning::Loading the aqueduct-runner module failed (attempt $attempt of 3)"
            sleep 15
          done
          exit 1

      - name: Contract test -- shared suite
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-${{ matrix.backend }}
            --source=./backend
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder

      - name: Contract test -- admission rejection
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-${{ matrix.backend }}-admission
            --source=./backend
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder

      - name: Contract test -- L8 request schemas
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-${{ matrix.backend }}-request-schemas
            --source=./backend
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder
